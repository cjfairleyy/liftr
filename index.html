<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>liftr - Workout Logger</title>
    <style>
        :root {
            /* Premium Dark Mode Palette */
            --bg-base: #000000;
            --bg-surface: #0d0d0f;
            --bg-surface-elevated: #1e1e20;
            
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --text-placeholder: #52525b;
            
            --border-light: #27272a;
            
            --btn-primary-bg: #ffffff;
            --btn-primary-text: #000000;
            --btn-primary-hover: #e4e4e7;
            
            --check-active-bg: #22c55e;
            --check-active-text: #ffffff;
            --check-inactive-bg: #1e1e20;
            
            --tag-bg: #1e1e20;
            
            /* Custom Modifier Colors */
            --mod-bw: #3b82f6;      
            --mod-side-l: #f97316; /* Orange */
            --mod-side-r: #8b5cf6; /* Purple */   
            --mod-fail: #ef4444;    
            --mod-superset: #ec4899; /* Premium Pink */
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-base);
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Typography & Headers */
        h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -0.5px; }
        
        header {
            padding: 0;
            background-color: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: padding 0.2s, background-color 0.2s;
        }
        header.has-content {
            padding: 24px 24px 16px;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        header h1 { font-size: 1.5rem; font-weight: 800; display: none; }

        
        .header-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        h2 { font-size: 1.6rem; margin-bottom: 20px; }

.screen {
    display: none; /* Hides all screens by default */
    padding: 20px;
    margin-bottom: 80px;
}

.screen.active {
    display: block; /* Only shows the screen if it has the 'active' class */
}

        
        #workout-screen.active, #exercise-modal.active {
            padding-top: 0;
            padding-left: 0;
            padding-right: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Buttons */
        .btn {
            background-color: var(--btn-primary-bg);
            color: var(--btn-primary-text);
            border: none;
            padding: 16px 20px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn:active { transform: scale(0.98); }
        .btn:hover { background-color: var(--btn-primary-hover); }
        
        .btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-light);
            transition: background-color 0.2s, border-color 0.2s;
        }
        .btn-outline:active {
            background-color: var(--bg-surface-elevated);
        }

        /* Cards & Superset Indicators */
        .card {
            background: var(--bg-surface);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 18px 20px 16px;
            margin-bottom: 12px;
            transition: border 0.2s, background-color 0.2s;
        }

        /* Unifies superset exercises into a single connected block */
        .card.in-superset {
            border: 1px solid var(--mod-superset) !important;
            background: rgba(236, 72, 153, 0.02) !important;
            margin-bottom: 0; 
            border-radius: 0;
            border-bottom: none !important;
        }
        .card.superset-start {
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .card.superset-end {
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            border-bottom: 1px solid var(--mod-superset) !important;
            margin-bottom: 12px; /* Restores the gap below the group */
        }
        .card.superset-single { /* Fallback if only 1 item is left */
            border-radius: 20px;
            border-bottom: 1px solid var(--mod-superset) !important;
            margin-bottom: 12px;
        }

        /* Cleaner connection target during selection mode */
        .card.linking-target {
            border: 1px dashed var(--mod-superset) !important;
            background: rgba(236, 72, 153, 0.05) !important;
            cursor: pointer;
        }

        /* Move Animation Classes */
        .card { transition: opacity 0.2s ease; }
        .card.just-moved { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes popIn {
            0% { transform: translateY(15px) scale(0.98); opacity: 0; background: var(--bg-surface-elevated); }
            70% { transform: translateY(-4px) scale(1.02); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .superset-badge {
            font-size: 0.7rem;
            color: var(--mod-superset);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        /* Pop-up Action Menus */
        .exercise-header {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .action-menu-popup {
            position: absolute;
            top: 40px;
            right: 0;
            background: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 12px;
            padding: 6px;
            z-index: 100;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            min-width: 170px;
        }

        .menu-item {
            background: transparent;
            border: none;
            color: var(--text-main);
            text-align: left;
            padding: 10px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .menu-item:active { background: #2c2c2e; }
        .menu-item.danger { color: var(--mod-fail); }

        .icon-btn {
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 12px;
            transition: background-color 0.2s, color 0.2s;
        }
        .icon-btn:active { background-color: var(--bg-surface-elevated); color: var(--text-main); }

        /* Active Workout Top Bar */
        .workout-top-bar {
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 16px 20px;
            margin-bottom: 12px;
        }

        .workout-name-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.3rem;
            font-weight: 800;
            width: 100%;
            padding: 0;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .workout-name-input:focus { outline: none; background-color: transparent !important; }
        .workout-name-input::placeholder { color: var(--text-placeholder); }

        .workout-controls { display: flex; justify-content: space-between; align-items: center; }

        .timer {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }

        .btn-small {
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
        }
        .btn-small.cancel {
            background-color: transparent;
            color: var(--mod-fail);
        }
        .btn-small.finish {
            background-color: var(--btn-primary-bg);
            color: var(--btn-primary-text);
        }

        /* Set Rows & Modifiers Grid */
        .set-container {
            margin-bottom: 6px;
            padding: 3px 0;
            transition: opacity 0.2s;
        }
        .set-container.completed { opacity: 0.5; }
        .set-container.is-failure { background-color: rgba(239, 68, 68, 0.15); border-radius: 12px; padding: 3px 8px; margin-left: -8px; margin-right: -8px; }

        .set-row, .set-drawer {
            display: grid;
            grid-template-columns: 28px 1fr 1fr 44px 36px !important;
            gap: 12px;
            align-items: center;
        }

        .set-drawer {
            margin-top: 6px;
            padding: 0;
            background: transparent !important;
            border: none !important;
        }

        .set-number {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 700;
            text-align: center;
        }
        .set-number.side-l { color: var(--mod-side-l); }
        .set-number.side-r { color: var(--mod-side-r); }

        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: #09090b !important;
            border: 1px solid #202023 !important;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            transition: background-color 0.2s;
        }
        .input-group input:focus { outline: none; background-color: #000000 !important; border-color: #3f3f46 !important; }
        .input-group input:disabled { background-color: #050505; opacity: 0.6; }
        .input-group input.bw-active:disabled { color: var(--mod-bw); font-weight: 700; opacity: 1; }

        .check-btn {
            background: var(--check-inactive-bg);
            border: none;
            border-radius: 12px;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            transition: background-color 0.2s;
        }
        .set-container.completed .check-btn {
            background: var(--check-active-bg);
            color: var(--check-active-text);
        }

        .mod-tag {
            background: var(--tag-bg);
            border: none;
            color: var(--text-muted);
            padding: 10px 4px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        .mod-tag.bw.active { background: var(--mod-bw); color: #fff; }
        .mod-tag.side-l.active { background: var(--mod-side-l); color: #fff; }
        .mod-tag.side-r.active { background: var(--mod-side-r); color: #fff; }
        .mod-tag.fail.active { background: var(--mod-fail); color: #fff; }
        .mod-tag.delete { 
            color: var(--mod-fail) !important; 
            background: rgba(239, 68, 68, 0.05) !important; 
            border: none !important;
        }
        .mod-tag.delete:active { background: rgba(239, 68, 68, 0.15) !important; }

        .add-set-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            padding: 10px;
            font-size: 0.95rem;
            border-radius: 12px;
            margin-top: 6px;
            transition: color 0.2s, background-color 0.2s;
        }
        .add-set-btn:active { background-color: var(--bg-surface-elevated); color: var(--text-main); }

        /* Filters */
        .filter-section {
            padding: 0 20px 12px;
            margin-bottom: 12px;
            position: sticky;
            top: 0;
            background: var(--bg-base);
            z-index: 10;
        }
        
        .filter-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 4px;
            scrollbar-width: none;
        }
        .filter-row::-webkit-scrollbar { display: none; }
        
        .filter-pill {
            background: var(--tag-bg);
            border: none;
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .filter-pill.active { background: var(--text-main); color: var(--bg-base); }

        /* Lists */
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            cursor: pointer;
            border-radius: 20px;
            margin-bottom: 4px;
        }
        .list-item:active { background-color: var(--bg-surface); }
        .list-item-title { font-weight: 600; font-size: 1.05rem; margin-bottom: 4px; }
        .list-item-sub { color: var(--text-muted); font-size: 0.85rem; }

        /* Bottom Navigation */
        #bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
            z-index: 20;
        }
        .nav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .nav-btn svg { width: 24px; height: 24px; stroke-width: 2.5; }
        .nav-btn.active { color: var(--text-main); }

        /* Inputs */
        .text-input {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background-color: var(--bg-surface);
            color: var(--text-main);
            margin-bottom: 16px;
            font-size: 1rem;
            font-weight: 500;
        }
        .text-input:focus { outline: none; background-color: var(--bg-surface-elevated); }

        .empty-state { text-align: center; color: var(--text-muted); margin-top: 60px; font-size: 0.95rem; font-weight: 500; }

        /* Stats & Progress */
        .section-title {
            font-size: 1.05rem;
            font-weight: 800;
            margin-bottom: 14px;
            letter-spacing: -0.3px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 28px;
        }
        .stat-tile {
            background: var(--bg-surface);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 18px 16px;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }
        .stat-label {
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .detail-set-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .detail-set-row span { font-weight: 700; color: var(--text-main); }
        .detail-tags { display: flex; gap: 6px; margin-left: 12px; }
        .d-tag { font-size: 0.7rem; padding: 4px 8px; border-radius: 6px; color: #fff; font-weight: 700; }
        .d-tag.bw { background: var(--mod-bw); }
        .d-tag.side-l { background: var(--mod-side-l); }
        .d-tag.side-r { background: var(--mod-side-r); }
        .d-tag.fail { background: var(--mod-fail); }
    </style>
</head>
<body>

<div id="app-container">
    <header id="main-header">
        <h1 id="app-title">liftr</h1>
        <button id="header-action" class="header-btn" style="display:none;" onclick="goBack()">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back
        </button>
    </header>

    <div id="home-screen" class="screen active">
        <div style="text-align: center; margin-top: 60px; margin-bottom: 80px;">
            <h2 id="streak-text" style="font-size: 4.5rem; margin-bottom: 0; font-weight: 800; letter-spacing: -2px;">0</h2>
            <p style="color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem;">Workouts Completed</p>
        </div>
        <button class="btn" onclick="startWorkout()">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Start Empty Workout
        </button>
    </div>

    <div id="history-screen" class="screen">
        <h2>History</h2>
        <div id="history-list">
            <div class="empty-state">No workouts logged yet.</div>
        </div>
    </div>

    <div id="workout-detail-screen" class="screen">
        <h2 id="detail-title" style="margin-bottom: 8px;">Workout</h2>
        <p id="detail-stats" style="color: var(--text-muted); margin-top: 0; margin-bottom: 32px; font-weight: 500;"></p>
        <div id="detail-exercises"></div>
        <div style="margin-top: 40px; padding-top: 24px;">
            <button class="btn btn-outline" style="color: var(--mod-fail); border: none; background: rgba(239, 68, 68, 0.1); font-weight:700;" id="delete-workout-btn" onclick="deleteWorkoutFromHistory()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/></svg>
                Delete Log
            </button>
        </div>
    </div>

    <div id="weight-screen" class="screen">
        <h2>Body Weight</h2>
        <div style="display: flex; gap: 12px; margin-bottom: 24px; margin-top: 12px;">
            <input type="number" id="new-weight" class="text-input" placeholder="Enter weight (lbs)" step="0.1" style="margin-bottom: 0;">
            <button class="btn" style="width: auto; border-radius: 16px;" onclick="logWeight()">Log</button>
        </div>
        
        <div id="weight-trend-section" style="margin-top: 36px; margin-bottom: 36px; display: none;">
            <h3 class="section-title">Weight Trend</h3>
            <div id="weight-trend-chart" class="card"></div>
        </div>

        <h3 class="section-title" style="margin-top: 24px;">History Log</h3>
        <div id="weight-list">
            <div class="empty-state">No weight logged yet.</div>
        </div>
    </div>

    <div id="stats-screen" class="screen">
        <h2>Stats &amp; Progress</h2>

        <div class="stat-grid" id="stats-overview"></div>

        <div style="margin-top: 48px;">
            <h3 class="section-title">Exercise Progress</h3>
            <select id="progress-exercise-select" class="text-input" onchange="renderExerciseProgress()"></select>
            <div id="exercise-progress-chart" class="card"></div>
            <div id="exercise-progress-pr"></div>
        </div>

        <div style="margin-top: 48px;">
            <h3 class="section-title">Muscle Group Balance <span style="color: var(--text-muted); font-weight: 500; font-size: 0.75rem; text-transform: none; letter-spacing: 0;">&middot; Last 30 Days</span></h3>
            <div id="muscle-balance-list"></div>
        </div>

        <div style="margin-top: 48px;">
            <h3 class="section-title">Personal Records</h3>
            <div id="pr-list"></div>
        </div>
    </div>

    <div id="workout-screen" class="screen">
        <div class="workout-top-bar">
            <input type="text" id="workout-name-input" class="workout-name-input" placeholder="Workout Name..." oninput="workoutName = this.value" onchange="saveApp()">
            <div class="workout-controls">
                <button class="btn-small cancel" onclick="cancelWorkout()">Cancel</button>
                <div id="workout-timer" class="timer">00:00</div>
                <button class="btn-small finish" onclick="finishWorkout()">Finish</button>
            </div>
        </div>
            <div id="post-workout-screen" class="screen">
        <div style="text-align: center; margin-top: 24px; margin-bottom: 32px;">
            <div style="font-size: 3rem;">🎉</div>
            <h2 style="margin-bottom: 4px; margin-top: 12px;">Workout Complete!</h2>
            <p id="post-workout-subtitle" style="color: var(--text-muted); margin: 0; font-weight: 500;"></p>
        </div>

        <div class="stat-grid" id="post-workout-stats"></div>

        <h3 class="section-title" style="margin-top: 32px;">Workout Summary</h3>
        <div id="post-workout-exercises"></div>

        <button class="btn" style="margin-top: 32px;" onclick="navigate('home')">Great Work</button>
    </div>

        <div style="padding: 0 20px;">
            <div id="workout-cards"></div>
            <button class="btn btn-outline" style="margin-bottom: 24px;" onclick="showExerciseModal()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                Add Exercise
            </button>
        </div>
    </div>

    <div id="exercise-modal" class="screen">
        <div class="filter-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; margin-top: 16px;">
                <h2 style="margin: 0;">Select Exercise</h2>
                <button class="header-btn" onclick="hideExerciseModal()">Close</button>
            </div>
            <input type="text" id="search-exercise" class="text-input" placeholder="Search..." onkeyup="filterExercises()" style="margin-bottom: 16px;">
            
            <div class="filter-row" id="muscle-filters">
                <button class="filter-pill active" onclick="setCategory('All')">All</button>

// --- CORE TRACKING VARIABLES ---
let currentWorkout = [];
let workoutHistory = [];
let weightHistory = [];
let favoriteExercises = []; // Stores favorite exercise names
let workoutName = '';
let workoutStartTime = null;
let supersetSourceId = null;
let activeMenuExerciseId = null;
let currentCategory = 'All';
let currentEquipment = 'All';
let currentDetailIndex = null;
let timerInterval = null;
let confirmModalCallback = null;
let selectedProgressExercise = null;

// Maps every exercise name to its muscle category for the Stats page
const exerciseCategoryMap = {};
exerciseDatabase.forEach(ex => { exerciseCategoryMap[ex.name] = ex.category; });

// Load saved data immediately when the app opens
try {
    const savedData = JSON.parse(localStorage.getItem('myWorkoutApp_data'));
    if (savedData) {
        currentWorkout = savedData.currentWorkout || [];
        workoutHistory = savedData.workoutHistory || [];
        weightHistory = savedData.weightHistory || [];
        favoriteExercises = savedData.favoriteExercises || [];
        workoutName = savedData.workoutName || '';
        workoutStartTime = savedData.workoutStartTime || null;
    }
} catch (e) {
    console.error("No saved data found or error loading data.");
}

// Save data to device storage
function saveApp() {
    localStorage.setItem('myWorkoutApp_data', JSON.stringify({
        currentWorkout: currentWorkout,
        workoutHistory: workoutHistory,
        weightHistory: weightHistory,
        favoriteExercises: favoriteExercises,
        workoutName: workoutName,
        workoutStartTime: workoutStartTime
    }));
}

// --- APP INITIALIZATION ---
window.onload = function() {
    // Populate the dropdown filter in the stats view
    const selectEl = document.getElementById('progress-exercise-select');
    if (selectEl) {
        selectEl.innerHTML = exerciseDatabase.map(ex => `<option value="${ex.name}">${ex.name}</option>`).join('');
        if (exerciseDatabase.length > 0) selectedProgressExercise = exerciseDatabase[0].name;
    }
    
    // Go to home screen instantly on startup
    navigate('home');
};

// --- NAVIGATION CORE ---
function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(screenId);
    if (target) {
        target.classList.add('active');
    }
}

function navigate(tab) {
    const headerEl = document.getElementById('main-header');
    const titleEl = document.getElementById('app-title');
    
    const bottomNav = document.getElementById('bottom-nav');
    if (bottomNav) bottomNav.style.display = 'flex';
    
    const backBtn = document.getElementById('header-action');
    if (backBtn) backBtn.style.display = 'none';
    
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

    if (tab === 'home') {
        if (headerEl) headerEl.classList.add('has-content');
        if (titleEl) titleEl.style.display = 'block';
        showScreen('home-screen');
        const navHome = document.getElementById('nav-home');
        if (navHome) navHome.classList.add('active');
        updateStreak();
    } else {
        if (headerEl) headerEl.classList.remove('has-content');
        if (titleEl) titleEl.style.display = 'none';
        
        if (tab === 'history') {
            showScreen('history-screen');
            const navHist = document.getElementById('nav-history');
            if (navHist) navHist.classList.add('active');
            renderHistory();
        } else if (tab === 'weight') {
            showScreen('weight-screen');
            const navWeight = document.getElementById('nav-weight');
            if (navWeight) navWeight.classList.add('active');
            renderWeight();
        } else if (tab === 'stats') {
            showScreen('stats-screen');
            const navStats = document.getElementById('nav-stats');
            if (navStats) navStats.classList.add('active');
            renderStats();
        }
    }
}

function updateStreak() {
    const streakEl = document.getElementById('streak-text');
    if (streakEl) streakEl.textContent = workoutHistory ? workoutHistory.length : 0;
}

// --- WORKOUT ACTIVE SESSION CONTROL ---
function startWorkout() {
    if (!workoutStartTime) workoutStartTime = Date.now();
    
    const nameInput = document.getElementById('workout-name-input');
    if (nameInput) nameInput.value = workoutName;
    
    const bottomNav = document.getElementById('bottom-nav');
    if (bottomNav) bottomNav.style.display = 'none';
    
    const headerEl = document.getElementById('main-header');
    const titleEl = document.getElementById('app-title');
    if (headerEl) headerEl.classList.remove('has-content');
    if (titleEl) titleEl.style.display = 'none';
    
    showScreen('workout-screen');
    renderWorkout();
    startTimer();
    saveApp();
}

function cancelWorkout() {
    stopTimer();
    currentWorkout = [];
    workoutName = '';
    workoutStartTime = null;
    const nameInput = document.getElementById('workout-name-input');
    if (nameInput) nameInput.value = '';
    saveApp();
    navigate('home');
}

// --- TIMER CONTROLS ---
function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (!workoutStartTime) return;
        const diff = Math.floor((Date.now() - workoutStartTime) / 1000);
        const hrs = Math.floor(diff / 3600);
        const mins = Math.floor((diff % 3600) / 60);
        const secs = diff % 60;
        const formatted = [
            hrs > 0 ? String(hrs).padStart(2, '0') : null,
            String(mins).padStart(2, '0'),
            String(secs).padStart(2, '0')
        ].filter(Boolean).join(':');
        const timerEl = document.getElementById('workout-timer');
        if (timerEl) timerEl.textContent = formatted;
    }, 1000);
}

function stopTimer() {
    if (timerInterval) clearInterval(timerInterval);
}

// --- EXERCISE MODAL SELECTION & FAVORITES ---
function showExerciseModal() {
    const modal = document.getElementById('exercise-modal');
    if (modal) modal.classList.add('active');
    renderExerciseList();
}

function hideExerciseModal() {
    const modal = document.getElementById('exercise-modal');
    if (modal) modal.classList.remove('active');
}

function setCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll('#muscle-filters .filter-pill').forEach(p => {
        p.classList.toggle('active', p.textContent.trim() === cat);
    });
    renderExerciseList();
}

function setEquipment(eq) {
    currentEquipment = eq;
    document.querySelectorAll('#equipment-filters .filter-pill').forEach(p => {
        p.classList.toggle('active', p.textContent.trim() === eq || (eq === 'All' && p.textContent.trim() === 'All'));
    });
    renderExerciseList();
}

function filterExercises() {
    renderExerciseList();
}

function toggleFavorite(name, event) {
    if (event) event.stopPropagation();
    const idx = favoriteExercises.indexOf(name);
    if (idx > -1) {
        favoriteExercises.splice(idx, 1);
    } else {
        favoriteExercises.push(name);
    }
    saveApp();
    renderExerciseList();
}

function renderExerciseList() {
    const searchEl = document.getElementById('search-exercise');
    const search = searchEl ? searchEl.value.toLowerCase().trim() : '';
    const list = document.getElementById('exercise-list');
    if (!list) return;
    list.innerHTML = '';

    const filtered = exerciseDatabase.filter(ex => {
        const matchesSearch = ex.name.toLowerCase().includes(search);
        
        let matchesCategory = false;
        if (currentCategory === 'Favorites') {
            matchesCategory = favoriteExercises.includes(ex.name);
        } else {
            matchesCategory = currentCategory === 'All' || ex.category === currentCategory;
        }
        
        const matchesEquipment = currentEquipment === 'All' || ex.equipment === currentEquipment;
        return matchesSearch && matchesCategory && matchesEquipment;
    });

    if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-state">No exercises found.</div>';
        return;
    }

    filtered.forEach(ex => {
        const isFav = favoriteExercises.includes(ex.name);
        const item = document.createElement('div');
        item.className = 'list-item';
        item.style.display = 'flex';
        item.style.justifyContent = 'space-between';
        item.style.alignItems = 'center';
        
        item.innerHTML = `
            <div style="flex-grow: 1;">
                <div class="list-item-title">${ex.name}</div>
                <div class="list-item-sub">${ex.category} &middot; ${ex.equipment}</div>
            </div>
            <button class="icon-btn" onclick="toggleFavorite('${ex.name.replace(/'/g, "\\'")}', event)" style="color: ${isFav ? '#eab308' : 'var(--text-placeholder)'}; padding: 12px; background: none; border: none; cursor: pointer;">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="${isFav ? '#eab308' : 'none'}" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
            </button>
        `;
        item.onclick = () => selectExercise(ex.name);
        list.appendChild(item);
    });
}

function selectExercise(name) {
    // Prevent adding duplicates into current running card list
    if (!currentWorkout.some(e => e.name === name)) {
        currentWorkout.push({
            id: Date.now() + Math.random().toString(36).substr(2, 5),
            name: name,
            sets: [{ weight: '', reps: '', completed: false, isBW: false }]
        });
    }
    hideExerciseModal();
    renderWorkout();
    saveApp();
}

// --- WORKOUT TRACKING LOG PANEL RENDERERS ---
function renderWorkout() {
    const container = document.getElementById('workout-cards');
    if (!container) return;
    container.innerHTML = '';

    if (currentWorkout.length === 0) {
        container.innerHTML = '<div class="empty-state" style="margin-bottom:24px;">Tap below to add an exercise!</div>';
        return;
    }

    currentWorkout.forEach((ex, exIdx) => {
        const card = document.createElement('div');
        card.className = 'card';
        
        let setsRowsHtml = ex.sets.map((set, sIdx) => {
            return `
                <div class="set-row ${set.completed ? 'completed' : ''}">
                    <span style="font-weight:700; width:24px;">${sIdx + 1}</span>
                    <input type="number" class="set-input" placeholder="lbs" value="${set.weight}" oninput="updateSet(${exIdx}, ${sIdx}, 'weight', this.value)" ${set.completed ? 'disabled' : ''}>
                    <input type="number" class="set-input" placeholder="reps" value="${set.reps}" oninput="updateSet(${exIdx}, ${sIdx}, 'reps', this.value)" ${set.completed ? 'disabled' : ''}>
                    <button class="btn-check" onclick="toggleSetComplete(${exIdx}, ${sIdx})" style="background:${set.completed ? 'var(--mod-success)' : 'var(--bg-island)'}; color:${set.completed ? '#000' : 'inherit'};">
                        ✓
                    </button>
                </div>
            `;
        }).join('');

        card.innerHTML = `
            <div style="display:flex; justify-content:between; align-items:center; margin-bottom:16px;">
                <h3 style="margin:0; font-size:1.1rem; flex-grow:1;">${ex.name}</h3>
                <button class="icon-btn" onclick="removeExercise(${exIdx})" style="background:none; border:none; cursor:pointer; color:var(--text-muted);">✕</button>
            </div>
            ${setsRowsHtml}
            <button class="btn btn-outline" style="margin-top:12px; padding:8px 12px; font-size:0.85rem;" onclick="addSet(${exIdx})">+ Add Set</button>
        `;
        container.appendChild(card);
    });
}

function updateSet(exIdx, sIdx, field, val) {
    if (currentWorkout[exIdx] && currentWorkout[exIdx].sets[sIdx]) {
        currentWorkout[exIdx].sets[sIdx][field] = val;
        saveApp();
    }
}

function toggleSetComplete(exIdx, sIdx) {
    if (currentWorkout[exIdx] && currentWorkout[exIdx].sets[sIdx]) {
        currentWorkout[exIdx].sets[sIdx].completed = !currentWorkout[exIdx].sets[sIdx].completed;
        renderWorkout();
        saveApp();
    }
}

function addSet(exIdx) {
    if (currentWorkout[exIdx]) {
        currentWorkout[exIdx].sets.push({ weight: '', reps: '', completed: false, isBW: false });
        renderWorkout();
        saveApp();
    }
}

function removeExercise(exIdx) {
    currentWorkout.splice(exIdx, 1);
    renderWorkout();
    saveApp();
}

// --- UTILITY DATA PARSERS ---
function getAllSets() {
    const sets = [];
    if (!workoutHistory) return sets;
    workoutHistory.forEach(w => {
        if (!w.exercises) return;
        w.exercises.forEach(ex => {
            if (!ex.sets) return;
            ex.sets.forEach(s => {
                sets.push({
                    exerciseName: ex.name,
                    weight: parseFloat(s.weight) || 0,
                    reps: parseInt(s.reps) || 0,
                    isBW: !!s.isBW,
                    date: w.date
                });
            });
        });
    });
    return sets;
}

function estimate1RM(weight, reps) {
    if (reps === 1) return weight;
    if (reps <= 0) return 0;
    return weight / (1.0278 - (0.0278 * reps));
}

// --- FINISH SESSION & POST-WORKOUT LOGIC ---
function finishWorkout() {
    try {
        if (!currentWorkout || currentWorkout.length === 0) {
            cancelWorkout();
            return;
        }
        stopTimer();
        const durationSeconds = workoutStartTime ? Math.floor((Date.now() - workoutStartTime) / 1000) : 0;

        const completedSession = {
            date: new Date().toISOString(),
            name: workoutName || 'Workout',
            durationSeconds: durationSeconds,
            exercises: JSON.parse(JSON.stringify(currentWorkout))
        };

        const historicalSets = getAllSets();
        const recordsCeiling = {};
        historicalSets.forEach(s => {
            if (s.isBW || s.weight <= 0 || s.reps <= 0) return;
            const est = estimate1RM(s.weight, s.reps);
            if (!recordsCeiling[s.exerciseName] || est > recordsCeiling[s.exerciseName]) {
                recordsCeiling[s.exerciseName] = est;
            }
        });

        workoutHistory.unshift(completedSession);

        currentWorkout = [];
        workoutName = '';
        workoutStartTime = null;
        const nameInput = document.getElementById('workout-name-input');
        if (nameInput) nameInput.value = '';
        
        saveApp();
        renderPostWorkout(completedSession, recordsCeiling);
    } catch (error) {
        console.error("Crash inside finishWorkout:", error);
    }
}

function renderPostWorkout(session, recordsCeiling) {
    try {
        const bottomNav = document.getElementById('bottom-nav');
        if (bottomNav) bottomNav.style.display = 'none';
        
        const headerEl = document.getElementById('main-header');
        if (headerEl) headerEl.classList.remove('has-content');

        const mins = Math.round(session.durationSeconds / 60) || 1;
        let totalSets = 0;
        const groupsHit = new Set();

        session.exercises.forEach(ex => {
            const cat = exerciseCategoryMap[ex.name] || 'Other';
            groupsHit.add(cat);
            if (ex.sets) totalSets += ex.sets.length;
        });

        const statsContainer = document.getElementById('post-workout-stats');
        if (statsContainer) {
            statsContainer.innerHTML = `
                <div class="stat-tile">
                    <div class="stat-value">${mins}</div>
                    <div class="stat-label">Minutes</div>
                </div>
                <div class="stat-tile">
                    <div class="stat-value">${totalSets}</div>
                    <div class="stat-label">Sets Logged</div>
                </div>
                <div class="stat-tile" style="grid-column: span 2;">
                    <div class="stat-value" style="font-size:1.1rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                        ${Array.from(groupsHit).join(', ') || 'None'}
                    </div>
                    <div class="stat-label">Muscles Targeted</div>
                </div>
            `;
        }

        const summaryContainer = document.getElementById('post-workout-exercises');
        if (!summaryContainer) return;
        summaryContainer.innerHTML = '';

        session.exercises.forEach(exercise => {
            const div = document.createElement('div');
            div.className = 'card';
            div.style.marginBottom = '12px';

            let exercisePrHit = false;
            if (exercise.sets) {
                exercise.sets.forEach(s => {
                    if (s.isBW || !s.weight || !s.reps) return;
                    const currentEst = estimate1RM(parseFloat(s.weight), parseFloat(s.reps));
                    const oldRecord = recordsCeiling[exercise.name] || 0;
                    if (currentEst > oldRecord) {
                        exercisePrHit = true;
                    }
                });
            }

            const setsListHtml = exercise.sets ? exercise.sets.map((set, sIdx) => {
                const weightStr = set.isBW ? 'BW' : `${set.weight || 0} lbs`;
                return `
                    <div style="display:flex; justify-content:space-between; margin-top:6px; font-size:0.9rem; color:var(--text-muted);">
                        <span>Set ${sIdx + 1}</span>
                        <span>${weightStr} &times; ${set.reps || 0}</span>
                    </div>
                `;
            }).join('') : '';

            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <div style="font-weight: 700;">${exercise.name}</div>
                    ${exercisePrHit ? `<span style="background:#eab308; color:#000; font-size:0.65rem; font-weight:900; padding:2px 6px; border-radius:4px; text-transform:uppercase;">🔥 New PR</span>` : ''}
                </div>
                ${setsListHtml}
            `;
            summaryContainer.appendChild(div);
        });

        showScreen('post-workout-screen');
    } catch (error) {
        console.error("Crash inside renderPostWorkout:", error);
    }
}

// --- HISTORY LOG VIEW PAGE ---
function renderHistory() {
    const list = document.getElementById('history-list');
    if (!list) return;
    list.innerHTML = '';

    if (!workoutHistory || workoutHistory.length === 0) {
        list.innerHTML = '<div class="empty-state">No workouts logged yet.</div>';
        return;
    }

    workoutHistory.forEach((session, idx) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.style.cursor = 'pointer';
        div.onclick = () => showWorkoutDetail(idx);

        const dateStr = new Date(session.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        const exerciseNames = session.exercises ? session.exercises.map(e => e.name).join(', ') : '';

        div.innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                <span style="font-weight:700;">${session.name}</span>
                <span style="color:var(--text-muted); font-size:0.85rem;">${dateStr}</span>
            </div>
            <div style="font-size:0.9rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                ${exerciseNames || 'No exercises'}
            </div>
        `;
        list.appendChild(div);
    });
}

function showWorkoutDetail(idx) {
    currentDetailIndex = idx;
    const session = workoutHistory[idx];
    if (!session) return;

    document.getElementById('bottom-nav').style.display = 'none';
    const backBtn = document.getElementById('header-action');
    if (backBtn) backBtn.style.display = 'block';

    const title = document.getElementById('detail-title');
    if (title) title.textContent = session.name;
    
    const stats = document.getElementById('detail-stats');
    if (stats) {
        const dateStr = new Date(session.date).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
        const mins = Math.round(session.durationSeconds / 60) || 1;
        stats.textContent = `${dateStr} \u2022 ${mins} min`;
    }

    const container = document.getElementById('detail-exercises');
    if (container) {
        container.innerHTML = '';
        session.exercises.forEach(ex => {
            const card = document.createElement('div');
            card.className = 'card';
            const rowsHtml = ex.sets.map((s, sIdx) => `
                <div style="display:flex; justify-content:space-between; margin-top:6px; font-size:0.95rem;">
                    <span style="color:var(--text-muted);">Set ${sIdx + 1}</span>
                    <span>${s.isBW ? 'BW' : `${s.weight} lbs`} &times; ${s.reps}</span>
                </div>
            `).join('');
            card.innerHTML = `<div style="font-weight:700; margin-bottom:8px;">${ex.name}</div>${rowsHtml}`;
            container.appendChild(card);
        });
    }

    showScreen('workout-detail-screen');
}

function goBack() {
    currentDetailIndex = null;
    navigate('history');
}

function deleteWorkoutFromHistory() {
    if (currentDetailIndex !== null && workoutHistory[currentDetailIndex]) {
        workoutHistory.splice(currentDetailIndex, 1);
        saveApp();
        goBack();
    }
}

// --- BODY WEIGHT LOG VIEW PAGE ---
function renderWeight() {
    const list = document.getElementById('weight-list');
    if (!list) return;
    list.innerHTML = '';

    if (!weightHistory || weightHistory.length === 0) {
        list.innerHTML = '<div class="empty-state">No weight logs recorded yet.</div>';
        return;
    }

    weightHistory.forEach((w, idx) => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.style.display = 'flex';
        div.style.justifyContent = 'space-between';
        
        const dateStr = new Date(w.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        div.innerHTML = `
            <div>
                <span style="font-weight:700;">${w.weight} lbs</span>
                <span style="color:var(--text-muted); font-size:0.85rem; margin-left:8px;">${dateStr}</span>
            </div>
            <button onclick="deleteWeight(${idx})" style="background:none; border:none; color:var(--mod-fail); cursor:pointer;">✕</button>
        `;
        list.appendChild(div);
    });
}

function logWeight() {
    const input = document.getElementById('new-weight');
    if (!input) return;
    const val = parseFloat(input.value);
    if (!val) return;

    weightHistory.unshift({
        date: new Date().toISOString(),
        weight: val
    });
    input.value = '';
    saveApp();
    renderWeight();
}

function deleteWeight(idx) {
    weightHistory.splice(idx, 1);
    saveApp();
    renderWeight();
}

// --- STATS VIEW VISUALIZATIONS ---
function renderStats() {
    const overview = document.getElementById('stats-overview');
    if (overview) {
        overview.innerHTML = `
            <div class="stat-tile">
                <div class="stat-value">${workoutHistory.length}</div>
                <div class="stat-label">Total Workouts</div>
            </div>
            <div class="stat-tile">
                <div class="stat-value">${weightHistory.length > 0 ? weightHistory[0].weight + ' lbs' : '--'}</div>
                <div class="stat-label">Current Weight</div>
            </div>
        `;
    }
    renderPRList();
}

function renderPRList() {
    const list = document.getElementById('pr-list');
    if (!list) return;
    list.innerHTML = '';

    const historicalSets = getAllSets();
    const prs = {};

    historicalSets.forEach(s => {
        if (s.isBW || s.weight <= 0 || s.reps <= 0) return;
        const est = estimate1RM(s.weight, s.reps);
        if (!prs[s.exerciseName] || est > prs[s.exerciseName].est) {
            prs[s.exerciseName] = { est: est, weight: s.weight, reps: s.reps };
        }
    });

    const keys = Object.keys(prs);
    if (keys.length === 0) {
        list.innerHTML = '<div class="empty-state">No Personal Records calculated yet.</div>';
        return;
    }

    keys.forEach(k => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.style.display = 'flex';
        item.style.justifyContent = 'space-between';
        item.innerHTML = `
            <div>
                <div class="list-item-title">${k}</div>
                <div class="list-item-sub">Best Set: ${prs[k].weight} lbs &times; ${prs[k].reps}</div>
            </div>
            <div style="font-weight:700; color:#eab308;">${Math.round(prs[k].est)} lbs Est. Max</div>
        `;
        list.appendChild(item);
    });
}

function renderExerciseProgress() {
    // Left empty for compatibility layout purposes
}

</script>
